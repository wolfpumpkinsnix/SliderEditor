<div class="thumb-wrapper" style="width: 1920px; height: 1080px; transform: scale(0.08333333333333333); transform-origin: top left; position: absolute; top: 0; left: 0; pointer-events: none;">
  <slide-renderer></slide-renderer>
</div>
<div class="thumb-badge" style="position: absolute; bottom: 4px; left: 4px; background: rgba(15,23,42,0.85); color: #94a3b8; font-size: 9px; padding: 1px 5px; border-radius: 3px; font-family: Inter, sans-serif; z-index: 10;"></div>
<div class="thumb-actions">
  <button class="thumb-action-btn" data-action="duplicate" title="Duplicate slide">⧉</button>
  <button class="thumb-action-btn thumb-action-btn--danger" data-action="delete" title="Delete slide">✕</button>
</div>
