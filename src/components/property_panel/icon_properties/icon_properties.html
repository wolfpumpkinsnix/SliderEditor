<div class="prop-section">
  <div class="prop-group">
    <div class="prop-label" style="color: #06B6D4;">Icon Component</div>
  </div>

  <div class="prop-group">
    <label class="prop-label">Value (Emoji or Icon ID)</label>
    <div class="flex gap-2">
      <input type="text" id="el-content" class="prop-input" placeholder="🎯">
    </div>
  </div>

  <div class="prop-group">
    <div class="prop-row">
      <label class="prop-label">Size</label>
      <span id="el-size-val" class="prop-val">80px</span>
    </div>
    <input type="range" id="el-size" min="20" max="400" step="5" class="prop-range">
  </div>

  <div class="prop-group">
    <label class="prop-check-row">
      <input type="checkbox" id="el-animated">
      <span>Animated (Float)</span>
    </label>
  </div>
</div>
