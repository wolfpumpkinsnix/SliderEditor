<div class="prop-section">
  <div class="prop-group">
    <div class="prop-label" style="color: #06B6D4;">Layout Component</div>
  </div>

  <div class="prop-group">
    <label class="prop-label">Type</label>
    <select id="el-layout-type" class="prop-select">
      <option value="flex">Flex</option>
      <option value="grid">Grid</option>
    </select>
  </div>

  <div id="grid-fields">
    <div class="prop-group">
      <label class="prop-label">Columns</label>
      <select id="el-columns" class="prop-select">
        <option value="2">2 Columns</option>
        <option value="3">3 Columns</option>
      </select>
    </div>
  </div>

  <div id="flex-fields">
    <div class="prop-group">
      <label class="prop-label">Direction</label>
      <select id="el-direction" class="prop-select">
        <option value="row">Horizontal (Row)</option>
        <option value="column">Vertical (Column)</option>
      </select>
    </div>
  </div>

  <div class="prop-group">
    <label class="prop-label">Gap (px)</label>
    <input type="number" id="el-gap" class="prop-input" value="16">
  </div>

  <div class="prop-group">
    <div id="grid-info" style="font-size: 12px; color: #64748b; font-style: italic; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 4px;">
      0 items - click an item on canvas to edit it
    </div>
  </div>
</div>
