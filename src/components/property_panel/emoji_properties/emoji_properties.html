<div class="prop-section">
  <div class="prop-group">
    <div class="prop-label" style="color: #06B6D4;">Emoji Properties</div>
  </div>

  <div class="prop-group">
    <label class="prop-label">Emoji / Symbol</label>
    <input type="text" id="el-content" class="prop-input" placeholder="Paste emoji here">
  </div>

  <div class="prop-group">
    <div class="prop-row" style="justify-content: space-between;">
      <label class="prop-label" style="margin-bottom: 0;">Size</label>
      <span id="el-size-val" style="font-size: 11px; color: #94a3b8; font-family: monospace;">64px</span>
    </div>
    <input type="range" id="el-size" min="16" max="256" step="8" class="prop-control">
  </div>

  <div class="prop-group">
    <label class="prop-check-row">
      <input type="checkbox" id="el-animated">
      <span style="font-size: 13px;">Float Animation</span>
    </label>
  </div>
</div>
