<div class="prop-section">
  <div class="prop-group">
    <div class="prop-label" style="color: #06B6D4;">List Component</div>
  </div>

  <div class="prop-group">
    <label class="prop-label">Items (one per line)</label>
    <textarea id="el-items" class="prop-textarea" rows="8" placeholder="Bullet 1\nBullet 2..."></textarea>
  </div>

  <div class="prop-group">
    <label class="prop-label">Bullet Style</label>
    <select id="el-style" class="prop-select">
      <option value="disc">Disc (●)</option>
      <option value="numbered">Numbered (1. 2. 3.)</option>
    </select>
  </div>

  <div class="prop-group">
    <label class="prop-label">Color Variant</label>
    <select id="el-variant" class="prop-select">
      <option value="muted">Muted</option>
      <option value="secondary">Secondary</option>
    </select>
  </div>
</div>
