<div class="prop-section">
  <div class="prop-group">
    <div class="prop-label" style="color: #06B6D4;">Card Properties</div>
  </div>

  <div class="prop-group">
    <label class="prop-label">Icon (Emoji)</label>
    <input type="text" id="el-icon" class="prop-input">
  </div>

  <div class="prop-group">
    <label class="prop-label">Title</label>
    <input type="text" id="el-title-input" class="prop-input">
  </div>

  <div class="prop-group">
    <label class="prop-label">Body Content</label>
    <textarea id="el-body" class="prop-textarea" rows="4"></textarea>
  </div>

  <div class="prop-group">
    <label class="prop-label">List Items (one per line)</label>
    <textarea id="el-list-items" class="prop-textarea" rows="4" placeholder="Item 1&#10;Item 2&#10;Item 3"></textarea>
  </div>

  <div class="prop-group">
    <label class="prop-label">Number Badge</label>
    <input type="number" id="el-number-badge" class="prop-input" min="0" placeholder="None">
  </div>

  <div class="prop-group">
    <label class="prop-label">Variant</label>
    <select id="el-variant" class="prop-select">
      <option value="glass">Glass</option>
      <option value="metric">Metric</option>
    </select>
  </div>
</div>
